services:
  - type: web
    name: lilycc-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        value: ./data/lilycc.db
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "30"
      - key: SESSION_ABSOLUTE_TIMEOUT_HOURS
        value: "12"
      - key: JOIN_RATE_LIMIT_MAX_ATTEMPTS
        value: "5"
      - key: JOIN_LOCKOUT_MINUTES
        value: "15"
      - key: DEV_LOGIN_ENABLED
        value: "false"
      - key: PUBLIC_APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INVITE_CODE_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: lily-4149d
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        value: lily-4149d.firebaseapp.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
